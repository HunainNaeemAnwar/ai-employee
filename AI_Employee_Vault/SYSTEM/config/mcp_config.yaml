# MCP Server Configuration
# Location: SYSTEM/config/mcp_config.yaml

# ===========================================
# Email MCP (Gmail)
# ===========================================
email_mcp:
  enabled: true
  provider: gmail
  rate_limit:
    max_emails_per_hour: 10
    max_emails_per_day: 100
  hitl_rules:
    auto_approve:
      - known_contact: true
      - max_body_length: 1000
      - no_external_links: true
    require_approval:
      - unknown_sender: true
      - contains_links: true
      - payment_related: true
      - body_length_over: 1000

# ===========================================
# Browser MCP (Playwright)
# ===========================================
browser_mcp:
  enabled: true
  headless: false  # Always show browser for security
  timeout_seconds: 60
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# ===========================================
# WhatsApp MCP (Silver Tier)
# ===========================================
whatsapp_mcp:
  enabled: false  # Enable in Silver tier
  hitl_always: true  # ALWAYS require human approval
  session_path: SECURITY/whatsapp_session/
  
# ===========================================
# Odoo MCP (Gold Tier)
# ===========================================
odoo_mcp:
  enabled: false  # Enable in Gold tier
  url: ""
  database: ""
  timeout_seconds: 30

# ===========================================
# Social Media MCP (Gold Tier)
# ===========================================
social_media_mcp:
  enabled: false  # Enable in Gold tier
  platforms:
    linkedin:
      enabled: false
      auto_post: false  # Always require approval
    twitter:
      enabled: false
      auto_post: false
    instagram:
      enabled: false
      auto_post: false
